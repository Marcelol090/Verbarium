<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verbarium · QA de assets</title><style>
:root{font-family:system-ui,sans-serif;color:#292443;background:#f8f7ff}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;z-index:4;background:#fffffff0;backdrop-filter:blur(16px);border-bottom:1px solid #e4dffc;padding:16px max(18px,calc((100vw - 1300px)/2))}header h1{font-size:21px;margin:0 0 5px}header p{margin:0;color:#77728d;font-size:12px}nav{display:flex;gap:9px;overflow:auto;margin-top:14px}nav button{padding:8px 14px;border:1px solid #ded7ef;background:#fff;border-radius:99px;font-weight:700;cursor:pointer;white-space:nowrap}nav button[aria-pressed="true"]{background:#6351d5;color:white}main{max-width:1300px;margin:24px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:17px}figure{margin:0;border:1px solid #dedaf0;border-radius:20px;overflow:hidden;background:white;box-shadow:0 5px 0 #ede8f7}figure .board{height:190px;display:grid;place-items:center;overflow:hidden;padding:14px;background:linear-gradient(45deg,#edecf7 25%,transparent 25%,transparent 75%,#edecf7 75%),linear-gradient(45deg,#edecf7 25%,#fff 25%,#fff 75%,#edecf7 75%);background-size:22px 22px;background-position:0 0,11px 11px}figure img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}figure[data-category="backgrounds"] img{max-height:178px}figcaption{padding:13px;font-size:11px;overflow-wrap:anywhere;color:#544a8c}figcaption b{display:block;font-size:12px;margin-bottom:5px}#status{font-size:12px;padding:12px 0;color:#645a85}.error{color:#b1365e!important}</style></head>
<body><header><h1>Verbarium · Biblioteca individual</h1><p>235 PNG/WebP isolados · QA visual, sem texto incorporado às imagens</p><nav id="nav" aria-label="Filtrar assets"></nav></header><main><div id="status" role="status">Verificando arquivos...</div><section class="grid" id="grid"></section></main><script type="module">
import {GROUPS,ITEMS,imageUrl} from './catalog.js';
let active='todos';const grid=document.querySelector('#grid'),nav=document.querySelector('#nav'),status=document.querySelector('#status');const keys=['todos',...Object.keys(GROUPS)];let missing=0;
nav.innerHTML=keys.map(k=>'<button data-group="'+k+'" aria-pressed="'+(k===active)+'">'+k+'</button>').join('');
function render(){missing=0;const items=active==='todos'?ITEMS:ITEMS.filter(id=>id.startsWith(active+'/'));grid.replaceChildren();status.textContent=items.length+' assets listados';for(const id of items){const fig=document.createElement('figure');fig.dataset.category=id.split('/')[0];const frame=document.createElement('div');frame.className='board';const picture=document.createElement('picture');const source=document.createElement('source');source.srcset=imageUrl(id);source.type='image/webp';const img=document.createElement('img');img.src=imageUrl(id,'png');img.loading='lazy';img.alt='';img.onerror=()=>{fig.style.outline='2px solid #db3368';missing++;status.textContent=items.length+' assets; '+missing+' arquivos indisponíveis';status.classList.add('error');};picture.append(source,img);frame.append(picture);const caption=document.createElement('figcaption');const b=document.createElement('b');b.textContent=id;caption.append(b);fig.append(frame,caption);grid.append(fig);}}
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-group]');if(!b)return;active=b.dataset.group;nav.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));status.classList.remove('error');render()});render();
</script></body></html>
