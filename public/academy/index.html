/** Pure learning logic shared by runtime and Node tests. No DOM dependencies. */

const STORAGE_KEY='verbarium.academy.v1';
const REVIEW_INTERVALS=Object.freeze([1,3,7,14,30]);
const PASSING_SCORE=70;
const GRADED=new Set(['visual','listening','pairs','cloze','arrange','dialogue','story']);
const isGraded=task=>GRADED.has(task.type);
const normalize=s=>String(s??'').normalize('NFKC').toLocaleLowerCase('en-US').replace(/[.,!?;:’']/g,'').replace(/\s+/g,' ').trim();
const localDate=(date=new Date())=>`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
const dayKey=localDate;
function addDays(key,n){const [y,m,d]=key.split('-').map(Number);const x=new Date(y,m-1,d+Number(n)||0);return localDate(x)}
const defaultProgress=()=>({version:1,completed:{},activity:{},reviews:{},xp:0,attempts:0,correct:0,teacherUnits:[],dailyGoal:25,accent:'en-US',session:null});
const safeText=(s,n=500)=>String(s??'').trim().slice(0,n);
function loadProgress(raw){try{const x=typeof raw==='string'?JSON.parse(raw):raw;if(!x||typeof x!=='object'||x.version!==1)return defaultProgress();const base=defaultProgress();return {...base,...x,completed:x.completed&&typeof x.completed==='object'?x.completed:{},reviews:x.reviews&&typeof x.reviews==='object'?x.reviews:{},activity:x.activity&&typeof x.activity==='object'?x.activity:{},teacherUnits:Array.isArray(x.teacherUnits)?x.teacherUnits.slice(0,30):[],session:x.session||null};}catch{return defaultProgress()}}
function getUnits(state){return [...DEFAULT_UNITS,...(state.teacherUnits||[])];}
function getUnit(state,id){return getUnits(state).find(u=>u.id===id);}
function isUnlocked(state,id){const units=getUnits(state),n=units.findIndex(u=>u.id===id);if(n<0)return false;if(units[n].world==='Aulas do Professor')return true;if(n===0)return true;if(units[n-1].world==='Aulas do Professor')return true;return !!state.completed[units[n-1].id] || (units[n-1].world!==units[n].world && !!state.completed[units[n-1].id]);}
function dueReviews(state,today=dayKey(),limit=12){const tasks=[];for(const unit of getUnits(state)){for(const task of unit.tasks){if(!isGraded(task))continue;const key=`${unit.id}:${task.id}`,entry=state.reviews[key];if(entry?.due&&entry.due<=today){tasks.push({key,unit,task,due:entry.due,errors:entry.errors||0});}}}return tasks.sort((a,b)=>a.due.localeCompare(b.due)||b.errors-a.errors).slice(0,limit)}
function reviewStats(state,today=dayKey()){const list=dueReviews(state,today,10000);return {due:list.length,stored:Object.keys(state.reviews).length}}
function updateReview(state,unitId,taskId,ok,today=dayKey()){const key=`${unitId}:${taskId}`,old=state.reviews[key]||{stage:-1,correct:0,errors:0};const stage=ok?Math.min(REVIEW_INTERVALS.length-1,old.stage+1):0;const due=ok?addDays(today,REVIEW_INTERVALS[stage]):today;state.reviews[key]={stage,due,correct:old.correct+(ok?1:0),errors:old.errors+(ok?0:1),last:today};return state.reviews[key]}
function recordAnswer(state,unit,task,ok,today=dayKey()){state.attempts++;if(ok)state.correct++;updateReview(state,unit.id,task.id,ok,today);return state;}
function earnXp(state,amount,today=dayKey()){const xp=Math.max(0,Math.round(Number(amount)||0));if(!xp)return 0;state.xp+=xp;const prev=state.activity[today]||{xp:0,answers:0};state.activity[today]={...prev,xp:prev.xp+xp};return xp}
function recordDailyAnswer(state,today=dayKey()){const prev=state.activity[today]||{xp:0,answers:0};state.activity[today]={...prev,answers:(prev.answers||0)+1};}
function streak(state,today=dayKey()){let days=0;let key=state.activity[today]?.xp>0?today:addDays(today,-1);while(state.activity[key]?.xp>0){days++;key=addDays(key,-1);}return days;}
function todayXp(state,today=dayKey()){return state.activity[today]?.xp||0}
function unitPercent(state,unit){const completed=state.completed[unit.id];return completed?Math.max(0,Math.min(100,Number(completed.score)||0)):0;}
function summary(state){const units=getUnits(state),finished=units.filter(u=>state.completed[u.id]);return {completed:finished.length,total:units.length,xp:state.xp,accuracy:state.attempts?Math.round(100*state.correct/state.attempts):null};}
function checkAnswer(task,selected){if(task.type==='pairs'){const correct=(task.pairs||[]).map(p=>String(p[0])+'|'+String(p[1]));return Array.isArray(selected)&&selected.length===correct.length&&selected.every(id=>correct.includes(id));}if(task.type==='arrange')return normalize(selected)===normalize(task.answer);if(['intro','speaking'].includes(task.type))return null;return normalize(selected)===normalize(task.answer)}
function createSession(unitId,phase='core',ids=null){return {unitId,phase,index:0,ids,selected:null,chosenWords:[],left:null,matched:[],feedback:null,reviewQueue:[],reviewHits:0,firstCorrect:0,firstAttempts:0,score:0,earned:0,startedAt:Date.now()};}
function sessionTasks(state,session){if(session.unitId==='__review__'){return (session.ids||[]).map(key=>{const sep=key.lastIndexOf(':');const unit=getUnit(state,key.slice(0,sep));return unit?.tasks.find(t=>t.id===key.slice(sep+1))?{unit,task:unit.tasks.find(t=>t.id===key.slice(sep+1))}:null}).filter(Boolean)}const unit=getUnit(state,session.unitId);const list=session.phase==='repair'?(session.reviewQueue||[]).map(id=>unit?.tasks.find(t=>t.id===id)).filter(Boolean):unit?.tasks||[];return list.map(task=>({unit,task}));}
function sanitizeTeacherBlock(block,i){if(!block||typeof block!=='object'||!['intro','visual','pairs','fill','sentence','listening','dialogue','speaking','explain','review'].includes(block.type))return null;
 const type=({fill:'cloze',sentence:'arrange',explain:'intro',review:'intro'})[block.type]||block.type;
 const task={id:safeText(block.id||`block-${i}`,90).replace(/[^a-zA-Z0-9_-]/g,'-'),type,skill:({visual:'vocabulary',pairs:'vocabulary',cloze:'grammar',arrange:'writing',listening:'listening',dialogue:'speaking',speaking:'speaking',intro:'reading'})[type],prompt:safeText(block.prompt||block.title,500),speech:safeText(block.speak||block.prompt,300),speaker:['explorer','hijab','blonde','grandfather','glasses','fox'].includes(block.character)?block.character:'explorer',explain:safeText(block.hint||'Observe o contexto e tente novamente.',360)};
 if(['visual','cloze','listening','dialogue'].includes(type)){task.options=Array.isArray(block.choices)?block.choices.slice(0,8).map(x=>safeText(x,100)):[];task.answer=safeText(block.answer,100);if(task.options.length<2||!task.options.includes(task.answer))return null;}
 if(type==='arrange'){task.words=Array.isArray(block.words)?block.words.slice(0,12).map(x=>safeText(x,50)):[];task.answer=safeText(block.answer,250);if(task.words.length<2||!task.answer)return null;}
 if(type==='pairs'){task.pairs=Array.isArray(block.pairs)?block.pairs.slice(0,6).filter(p=>Array.isArray(p)&&p.length>=2).map(([a,b])=>[safeText(a,90),safeText(b,90)]):[];if(task.pairs.length<2)return null;}
 return task;

function validateTeacherPack(pack){if(!pack||pack.format!=='verbarium.lesson-pack'||pack.schemaVersion!==1||!Array.isArray(pack.lessons)||pack.lessons.length<1||pack.lessons.length>30)throw new Error('Pacote de aulas inválido.');

 return `<section class="lesson-wrap"><div class="lesson-top"><button type="button" class="close-lesson" data-action="exit" aria-label="Sair da aula">×</button><div class="lesson-track" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="Progresso da aula"><i style="width:${pct}%"></i></div><span>${s.index+1}/${n}</span></div><div class="lesson-kicker">${esc(s.phase==='repair'?'REVISÃO DOS ERROS':s.unitId==='__review__'?'REVISÃO PERSONALIZADA':unit.title)} · ${esc(unit.level)}</div><div class="actor-stage"><div class="actor-bg" aria-hidden="true"></div><img data-actor src="${imageUrl('v6','characters',actor.neutral)}" onerror="this.style.display='none'" alt="Personagem ${esc(actor.name)}" loading="eager"><div class="actor-meta"><strong>${esc(actor.name)}</strong><small>Conversa em inglês</small></div></div><div class="speech-box">${makeSpoken(task.speech,hidden)}<div class="audio-actions"><button class="audio-button" type="button" data-action="audio" aria-label="Ouvir o personagem">🔊 <span>Ouvir</span></button><button class="audio-button slow" type="button" data-action="slow" aria-label="Ouvir mais devagar">◷ <span>Devagar</span></button><span id="voice-status" role="status" aria-live="polite"></span></div></div><div class="exercise-box"><span class="eyebrow">${esc(badgeMap[task.type]||'ATIVIDADE')}</span><h1>${esc(task.prompt)}</h1>${form}</div>${fb?`<div class="feedback ${fb.ok?'good':'try'}" role="status"><span>${fb.ok?'✓':'↻'}</span><div><b>${fb.ok?'Muito bem!':'Vamos entender a resposta.'}</b><p>${esc(task.explain||'Observe o contexto e tente novamente.')}</p>${!fb.ok?`<small>Resposta esperada: <strong>${esc(task.type==='pairs'?task.pairs.map(p=>p.join(' → ')).join('; '):task.answer)}</strong></small>`:''}</div></div>`:''}<div class="lesson-actions">${fb||nonGraded?`<button type="button" class="primary-action next-action" data-action="next">${s.index===n-1?'Ver resultado':'Continuar'} →</button>`:`<button type="button" class="primary-action next-action" data-action="check" ${!chosen?'disabled':''}>Verificar resposta</button>`}</div></section>`}
function renderFinish(){if(!completedSummary)return `<section class="empty-state"><button data-route="path">Voltar à trilha</button></section>`;const r=completedSummary,stars=r.score>=95?3:r.score>=80?2:r.passed?1:0;return `<section class="finish-page">${v5('rewards','chest_open','finish-chest','🎁')}<span class="eyebrow">AULA FINALIZADA</span><h1>${r.passed?'Missão concluída!':'Você avançou. Vamos reforçar?'}</h1><p>${r.passed?'Você atingiu a pontuação necessária nesta unidade.':'Revise as explicações e repita a atividade para desbloquear a próxima.'}</p><div class="finish-stars">${[0,1,2].map(i=>v5('rewards',i<stars?'star_active':'star_inactive','','⭐')).join('')}</div><div class="finish-stats"><div><span>Precisão inicial</span><b>${r.score}%</b></div><div><span>Respostas corretas</span><b>${r.correct}/${r.total}</b></div><div><span>XP obtidos</span><b>+${r.earned}</b></div></div><div class="finish-actions"><button class="primary-action" data-route="path">Voltar à trilha →</button><button class="secondary-action" data-route="review">Revisão personalizada ↻</button></div></section>`}
function submit(){const s=currentSession(),item=currentItem();if(!s||!item||s.feedback)return;const {unit,task}=item;if(!isGraded(task))return goNext();let answer=task.type==='pairs'?s.matched.map(i=>task.pairs[i].join('|')):task.type==='arrange'?s.chosenWords.map(i=>task.words[i]).join(' '):s.selected;if(!answer||Array.isArray(answer)&&!answer.length)return;let ok=checkAnswer(task,answer);if(task.type==='pairs'&&s.pairFaults)ok=false;
 const isFirst=s.phase==='core'&&s.unitId!=='__review__';if(isFirst){s.firstAttempts++;if(ok)s.firstCorrect++;else if(!s.reviewQueue.includes(task.id))s.reviewQueue.push(task.id);}recordAnswer(state,unit,task,ok);recordDailyAnswer(state);const xp=ok?(s.phase==='repair'?2:s.unitId==='__review__'?3:5):0;s.earned+=earnXp(state,xp);s.feedback={ok,explain:task.explain||'',answer};SAVE();render();setActorPose(CHARACTERS[task.speaker]||CHARACTERS.explorer,ok?'good':'wrong');}
function goNext(){const s=currentSession();if(!s)return;stopSpeech();s.index++;s.selected=null;s.chosenWords=[];s.left=null;s.matched=[];s.feedback=null;s.pairFaults=false;const list=sessionTasks(state,s);if(s.index>=list.length){if(s.phase==='core'&&s.unitId!=='__review__'&&s.reviewQueue.length){s.phase='repair';s.index=0;showToast('Vamos rever rapidamente os conceitos que você errou.');SAVE();render();return}const earned=s.earned;const finish=finishSession(state,s);completedSummary={...finish,earned};SAVE();navigate('finished');return}SAVE();render();}
function pairPick(side,index){const s=currentSession(),item=currentItem();if(!s||!item||s.feedback)return;const {task}=item;if(task.type!=='pairs'||s.matched.includes(index))return;if(side==='left'){s.left=index;SAVE();render();return}if(s.left===null){showToast('Selecione um item na coluna da esquerda primeiro.');return}if(s.left===index){s.matched.push(index);s.left=null;SAVE();if(s.matched.length===task.pairs.length){s.selected='done';submit();}else render();}else{s.pairFaults=true;s.left=null;SAVE();showToast('Esses itens não combinam. Experimente outro par.');render();}}
function startRecord(){const box=$('#speech-transcript');const API=window.SpeechRecognition||window.webkitSpeechRecognition;if(!API){if(box)box.textContent='Reconhecimento de fala indisponível neste navegador. Você pode praticar mesmo sem ele.';return}const r=new API();r.lang=state.accent;r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{if(box)box.textContent='O navegador entendeu: “'+e.results[0][0].transcript+'”. Isso não é uma nota de pronúncia.';};r.onerror=()=>{if(box)box.textContent='Não foi possível transcrever. Você pode repetir a frase manualmente.';};try{r.start();if(box)box.textContent='Ouvindo, com permissão do navegador…'}catch{if(box)box.textContent='Microfone não disponível.'}}
function importLocalDrafts(){try{const raw=storageGet('verbarium.teacher-studio.demo.v1');if(!raw)throw new Error('Não há rascunhos do Studio neste navegador.');const data=JSON.parse(raw);if(!Array.isArray(data.lessons))throw new Error('Rascunho inválido.');const n=importTeacherPack(state,{format:'verbarium.lesson-pack',schemaVersion:1,lessons:data.lessons});SAVE();render();showToast(`${n} aulas carregadas localmente. Não foram publicadas para outras pessoas.`)}catch(e){showToast(e.message)}}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;const r=el.dataset.route;if(r){navigate(r);return}if(el.dataset.unit){startUnit(el.dataset.unit);return}if(el.dataset.practice){startPractice(el.dataset.practice);return}const s=currentSession(),item=currentItem();if(el.dataset.pick!==undefined&&s&&!s.feedback){s.selected=el.dataset.pick;SAVE();render();return}if(el.dataset.word!==undefined&&s&&!s.feedback){const n=Number(el.dataset.word);if(!s.chosenWords.includes(n))s.chosenWords.push(n);SAVE();render();return}if(el.dataset.remove!==undefined&&s&&!s.feedback){s.chosenWords=s.chosenWords.filter(i=>i!==Number(el.dataset.remove));SAVE();render();return}if(el.dataset.pairSide){pairPick(el.dataset.pairSide,Number(el.dataset.pairIdx));return}switch(el.dataset.action){case 'resume':navigate('session');break;case 'undo':if(s){s.chosenWords.pop();SAVE();render();}break;case 'audio':if(item)speak(item.task.speech,item.task.speaker,false);break;case 'slow':if(item)speak(item.task.speech,item.task.speaker,true);break;case 'record-speech':startRecord();break;case 'check':submit();break;case 'next':goNext();break;case 'exit':navigate('path');break;case 'review-start':startReviews();break;case 'teacher-import':$('#teacher-import').click();break;case 'teacher-local':importLocalDrafts();break;}});
document.addEventListener('change',async e=>{if(e.target.id==='accent'){state.accent=e.target.value;SAVE();showToast('Sotaque atualizado.');return}if(e.target.id==='goal'){state.dailyGoal=Number(e.target.value);SAVE();render();return}if(e.target.id==='teacher-import'){const f=e.target.files?.[0];if(!f)return;try{if(f.size>2000000)throw new Error('Pacote maior que 2 MB.');const pack=JSON.parse(await f.text());const n=importTeacherPack(state,pack);SAVE();render();showToast(`${n} aulas importadas para este navegador.`);}catch(err){showToast(err.message||'Importação inválida.')}e.target.value='';}});
window.addEventListener('beforeunload',stopSpeech);
render();
</script>
