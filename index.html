<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f5f4ff" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<title>Verbarium | Estúdio de inglês</title>
<meta name="description" content="Um estúdio interativo para aprender gramática, tempos verbais, vocabulário e conversação em inglês." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
<div class="shell">
  <aside class="sidebar" aria-label="Navegação principal">
    <div class="brand"><div class="brand-mark" aria-hidden="true">V</div><div class="brand-copy"><div class="brand-name">Verbarium<span class="brand-dot">.</span></div><div class="brand-sub">YOUR ENGLISH JOURNEY</div></div></div>
    <div class="nav-label">SEU ESTÚDIO</div>
    <nav id="desktop-nav"></nav>
    <div class="sidebar-bottom"><div class="spark" aria-hidden="true">✦ ✳</div><div class="note-head">Every word<br><i>counts!</i></div><small>Um espaço leve para aprender, praticar e perder o medo de conversar.</small></div>
    <div class="sidebar-footer">ENGLISH MADE FOR REAL LIFE ✦</div>
  </aside>
  <div class="stage">
    <header class="topbar"><div class="crumb"><span class="mobile-wordmark">verbarium<span>.</span></span><span class="desktop-crumb">MEU ESPAÇO</span><span class="desktop-crumb" aria-hidden="true">/</span><strong id="breadcrumb">Início</strong></div><div class="top-actions"><div class="tiny-progress"><span id="top-completed">0 aulas</span><span class="tiny-bar"><i id="top-progress"></i></span></div><span class="top-tag">🇧🇷 PT <span aria-hidden="true">→</span> 🇬🇧 EN</span><button class="avatar" data-route="progress" aria-label="Abrir meu progresso">✦</button></div></header>
    <div class="body-grid"><main id="main" class="main" tabindex="-1"></main><aside id="rail" class="rail" aria-label="Dicas de estudo"></aside></div>
  </div>
</div>
<nav class="mobile-nav" id="mobile-nav" aria-label="Navegação mobile"></nav>
<div id="announcer" aria-live="polite" class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<script type="module" src="/src/app.js"></script>
</body>
</html>
